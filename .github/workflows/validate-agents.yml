name: validate-agents

# Hard gate: the agent execution layer (agents.json + per-page #agent-spec +
# llms.txt) must stay in sync on every push and PR. The validator uses only
# Node built-ins, so no install step is needed.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate agent execution layer
        run: node scripts/validate-agents.mjs
