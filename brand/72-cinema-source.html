<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#05050a}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    font-family:Georgia,'DejaVu Serif','Liberation Serif','Times New Roman',serif;}
  .layer{position:absolute;inset:0}
  #base{background:radial-gradient(120% 90% at 50% 42%,#12121c 0%,#0a0a12 55%,#050509 100%);}
  #opal{will-change:transform;opacity:.85;
    background:
      radial-gradient(42% 30% at 32% 30%,rgba(212,168,214,0.22),transparent 62%),
      radial-gradient(40% 34% at 70% 62%,rgba(150,206,214,0.20),transparent 62%),
      radial-gradient(46% 30% at 55% 46%,rgba(232,214,166,0.15),transparent 64%),
      radial-gradient(38% 30% at 24% 74%,rgba(176,166,224,0.18),transparent 62%);
    filter:blur(46px);}
  #vig{background:radial-gradient(125% 95% at 50% 45%,transparent 40%,rgba(0,0,0,0.72) 100%);}
  .grp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:900px;text-align:center;opacity:0;
    filter:drop-shadow(0 0 22px rgba(206,196,232,0.35));}
  .line{font-weight:400;font-size:60px;line-height:1.5;letter-spacing:1px;
    background:linear-gradient(100deg,#eef0f4 0%,#f2e2ef 18%,#e4eef4 36%,#f6efdd 52%,#e9e2f4 70%,#eef0f4 100%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}
  #end .big{font-size:360px;font-weight:400;line-height:1;letter-spacing:2px;
    background:linear-gradient(100deg,#f2f2f6 0%,#f3e2ef 20%,#e2eef4 42%,#f7efdb 60%,#e8e1f4 100%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}
  #end .url{margin-top:26px;font-size:46px;letter-spacing:10px;font-weight:400;
    text-transform:lowercase;
    background:linear-gradient(100deg,#d9d6e2,#efe6f0,#d9e2ea,#efe8da,#d9d6e2);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}
</style></head><body>
<div id="stage">
  <div class="layer" id="base"></div>
  <div class="layer" id="opal"></div>
  <div class="grp" id="A"><div class="line shim">The internet made everyone reachable.<br>It also made everyone interruptible.</div></div>
  <div class="grp" id="B"><div class="line shim">Maybe the rarest thing online<br>isn&rsquo;t information anymore.<br>Maybe it&rsquo;s uninterrupted attention.</div></div>
  <div class="grp" id="C"><div class="line shim">If your phone rang less...<br>but every call mattered more...<br>would that be a better phone?</div></div>
  <div class="grp" id="end"><div class="big shim">72</div><div class="url shim">velvetrope2you.com</div></div>
  <div class="layer" id="vig"></div>
</div>
<script>
function sm(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function env(t,a,b,c,d){if(t<=a||t>=d)return 0;if(t<b)return sm((t-a)/(b-a));if(t<=c)return 1;return sm(1-(t-c)/(d-c));}
function renderFrame(t){
  var op=document.getElementById('opal');
  op.style.transform='translate('+(Math.sin(t*0.19)*7).toFixed(2)+'%,'+(Math.cos(t*0.15)*6).toFixed(2)+'%) rotate('+(t*2.4).toFixed(2)+'deg)';
  var sp=((t*9)%200).toFixed(2);
  var s=document.querySelectorAll('.shim'); for(var i=0;i<s.length;i++){s[i].style.backgroundPositionX=sp+'%';}
  document.getElementById('A').style.opacity=env(t,0.6,1.7,4.8,6.0).toFixed(4);
  document.getElementById('B').style.opacity=env(t,7.1,8.2,11.3,12.5).toFixed(4);
  document.getElementById('C').style.opacity=env(t,13.6,14.7,17.8,19.0).toFixed(4);
  document.getElementById('end').style.opacity=sm((t-19.0)/1.1).toFixed(4);
}
window.renderFrame=renderFrame; renderFrame(0);
</script></body></html>
