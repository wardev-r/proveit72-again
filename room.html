<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your 72 room</title>
<meta name="theme-color" content="#080808" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080808'/%3E%3Ctext x='32' y='45' font-family='Inter,Arial,sans-serif' font-size='34' font-weight='800' fill='%23D4A017' text-anchor='middle'%3E72%3C/text%3E%3C/svg%3E" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#080808;color:#f0f0e8;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #1c1c1c;flex-shrink:0}
  .badge{width:32px;height:32px;border-radius:8px;background:#080808;border:1px solid #252525;display:flex;align-items:center;justify-content:center;font-weight:900;color:#D4A017;font-size:.85rem}
  header .t{font-size:.85rem;font-weight:600}
  header .s{font-size:.72rem;color:#8a8a80}
  header a{margin-left:auto;font-size:.78rem;color:#D4A017;text-decoration:none;font-weight:600}
  #stage{flex:1;position:relative;background:#0a0a0a}
  iframe{width:100%;height:100%;border:0;display:block}
  .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  .msg h1{font-size:1.3rem;font-weight:800}
  .msg p{color:#8a8a80;font-size:.9rem;max-width:360px}
  .msg a{color:#0a0a0a;background:#D4A017;padding:12px 22px;border-radius:10px;font-weight:800;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
  <header>
    <div class="badge">72</div>
    <div><div class="t">Your private room</div><div class="s" id="roomName">connecting…</div></div>
    <a href="/">Leave</a>
  </header>
  <div id="stage"><div class="msg"><p>Setting up your room…</p></div></div>

<script>
  const room = new URLSearchParams(location.search).get('r');
  const stage = document.getElementById('stage');
  if (!room){
    stage.innerHTML = '<div class="msg"><h1>No room found</h1><p>This link is missing its room. If you just paid, check your email for the room link, or contact support@velvetrope2you.com.</p><a href="/">Back to 72</a></div>';
  } else {
    document.getElementById('roomName').textContent = room;
    const url = 'https://meet.jit.si/' + encodeURIComponent(room);
    const f = document.createElement('iframe');
    f.src = url;
    f.allow = 'camera; microphone; fullscreen; display-capture; autoplay';
    f.setAttribute('allowfullscreen','true');
    stage.innerHTML = '';
    stage.appendChild(f);
    // Fallback if the embed is blocked
    setTimeout(() => {
      if (!f.contentWindow || f.clientHeight < 40){
        stage.innerHTML = '<div class="msg"><h1>Open your room</h1><p>Tap below to join the private call.</p><a href="'+url+'" target="_blank" rel="noopener">Join room →</a></div>';
      }
    }, 4000);
  }
</script>
</body>
</html>
