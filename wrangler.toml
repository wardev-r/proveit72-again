name = "proveit72-again"
main = "72-stripe-worker.js"
compatibility_date = "2024-09-23"

# Public API is served on a stable custom domain so the URL never changes when
# the worker is renamed/redeployed. `wrangler deploy` provisions the hostname +
# TLS cert and creates the proxied DNS record automatically.
[[routes]]
pattern = "api.velvetrope2you.com"
custom_domain = true

# After running: wrangler kv namespace create "KV_72"
# paste the printed id below
[[kv_namespaces]]
binding = "KV_72"
id = "0fb09e694dcc4b2fa5bab232724482f8"

[vars]
# Non-secret config — secrets go via: wrangler secret put <NAME>

# Secrets to set (run each command separately):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put PLATFORM_URL
#   wrangler secret put OWNER_API_KEY
